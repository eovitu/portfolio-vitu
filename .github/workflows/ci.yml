name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The dependency tree has a few packages whose peer ranges have not
      # caught up with ESLint 9; the resolution is deliberate, so CI installs
      # with the same flag used locally rather than failing on it.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx vite build
