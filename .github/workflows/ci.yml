name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+ is required: `npm test` runs Node's built-in TypeScript
          # stripping (`--experimental-strip-types`), added in Node 22.6 and
          # unavailable on 20.
          node-version: 22
          cache: npm

      # The dependency tree has a few packages whose peer ranges have not
      # caught up with ESLint 9; the resolution is deliberate, so CI installs
      # with the same flag used locally rather than failing on it.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npx vite build
